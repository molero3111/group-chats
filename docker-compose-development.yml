services:

  web:
    build: ./
    command: ./start.sh --environment=local --load-fixtures
    volumes:
      - .:/app  # live code reload
    ports:
      - "${HOST_MACHINE_WEB_PORT:-8000}:8000"
    env_file:
      - ./.env
    depends_on:
      - db
      - redis
    networks:
      - group_chats_network

  db:
    image: postgres:18-alpine
    volumes:
      - group_chats_postgres:/var/lib/postgresql
    env_file:
      - ./.env
    networks:
      - group_chats_network

  redis:
    image: redis:8-alpine
    env_file:
      - ./.env
    command: redis-server --requirepass ${REDIS_PASSWORD}
    networks:
      - group_chats_network

volumes:
  group_chats_postgres:

networks:
  group_chats_network:
