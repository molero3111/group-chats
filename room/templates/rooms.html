{% extends 'base.html' %}

{% block title %} Rooms | {% endblock %}

{% block content %}
<h1 class="h3 mb-4">Rooms</h1>
<div class="row g-3">
    {% for room in rooms %}
    <div class="col-12 col-sm-6 col-lg-4">
        <a href="{% url 'room' room.slug %}" class="card room-card h-100 text-decoration-none shadow-sm">
            <div class="card-body d-flex align-items-center justify-content-between">
                <span class="h5 mb-0"># {{ room.name }}</span>
                <span class="btn btn-sm btn-outline-primary">Join</span>
            </div>
        </a>
    </div>
    {% empty %}
    <p class="text-body-secondary">No rooms yet.</p>
    {% endfor %}
</div>
{% endblock %}
