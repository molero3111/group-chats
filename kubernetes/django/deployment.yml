apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-app
  labels:
    app: chat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chat
  template:
    metadata:
      labels:
        app: chat
    spec:
      containers:
        - image: molero3111/django-chat:v1
          imagePullPolicy: Always
          name: chat
          envFrom:
            - secretRef:
                name: chat-secret
            - configMapRef:
                name: chat-config
          ports:
            - containerPort: 8000
              name: daphne
          volumeMounts:
            - name: media-volume-mount
              mountPath: /app/media
      volumes:
        - name: media-volume-mount
          persistentVolumeClaim:
            claimName: media-pvc
