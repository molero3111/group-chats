apiVersion: apps/v1
kind: Deployment
metadata:
  name: group-chats
  labels:
    app: group-chats
spec:
  replicas: 1
  selector:
    matchLabels:
      app: group-chats
  template:
    metadata:
      labels:
        app: group-chats
    spec:
      containers:
        - image: molero3111/group-chats:v1
          imagePullPolicy: Always
          name: group-chats
          envFrom:
            - secretRef:
                name: group-chats-secret
            - configMapRef:
                name: group-chats-config
          ports:
            - containerPort: 8000
              name: daphne
          volumeMounts:
            - name: media-volume-mount
              mountPath: /app/media
      volumes:
        - name: media-volume-mount
          persistentVolumeClaim:
            claimName: media-pvc
