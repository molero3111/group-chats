version: '3.8'

services:
  web:
    build:
      context: ./
      dockerfile: Dockerfile
    restart: always
    command: sh -c "python manage.py makemigrations && python manage.py migrate && python manage.py collectstatic --no-input && daphne djangochat.asgi:application -b 0.0.0.0 -p 8000"
    expose:
      - 8000
    env_file:
      - ./.env
    depends_on:
      - db
      - redis

  nginx:
      image: nginx:latest
      volumes:
        - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      ports:
        - "80:80"
      depends_on:
        - web

  db:
    image: postgis/postgis:13-3.1
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    env_file:
      - ./.env

  redis:
    image: "redis:7.2.1"
    restart: always
    env_file:
      - ./.env

volumes:
  postgres_data:
