{% extends 'base.html' %}

{% block title %} Log in | {% endblock %}

{% block content %}
<div class="auth-card card shadow-sm mx-auto my-auto">
    <div class="card-body p-4">
        <h1 class="h3 mb-4">Log in</h1>
        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}
            <div class="mb-3">
                <label for="username" class="form-label">Email or username</label>
                <input type="text" name="username" id="username" autocomplete="username" required autofocus
                       value="{{ form.username.value|default_if_none:'' }}" class="form-control">
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" name="password" id="password" autocomplete="current-password" required
                       class="form-control">
            </div>
            {% for error in form.non_field_errors %}
            <div class="alert alert-danger py-2">{{ error }}</div>
            {% endfor %}
            <button type="submit" class="btn btn-primary w-100">Log in</button>
        </form>
        <p class="mt-3 mb-0 small text-body-secondary">No account? <a href="{% url 'signup' %}">Sign up</a></p>
    </div>
</div>
{% endblock %}
