name: CI

on:
  push:
    # deploy-homelab.yml calls this workflow for staging, so a staging push runs it once.
    branches-ignore:
      - staging
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python manage.py makemigrations --check --dry-run --settings=groupchats.settings_test
      - run: python manage.py test --settings=groupchats.settings_test
