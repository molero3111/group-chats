apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-app
  labels:
    app: chat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chat
  template:
    metadata:
      labels:
        app: chat
    spec:
      containers:
        - name: chat-app
          image: your-chat-image:tag
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: config-volume
              mountPath: /app/.env
              subPath: .env
      volumes:
        - name: config-volume
          configMap:
            name: chat-app-config

